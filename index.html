<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="brand"><i></i>AI Academy</div>
  <span class="chip" id="c-streak" title="Days in a row with some study"></span>
  <span class="chip" id="c-level" title="XP: 100 per level"></span>
  <span class="chip" id="c-goal" title="Minutes studied today against your daily goal"></span>
  <button class="chip btn" id="c-find" type="button" aria-keyshortcuts="/">Find<kbd aria-hidden="true">/</kbd></button>
  <button class="chip btn" id="c-review" type="button" aria-keyshortcuts="R"></button>
  <button class="chip btn icon" id="c-theme" type="button" aria-keyshortcuts="D"><i class="half" aria-hidden="true"></i></button>
  <button class="chip btn" id="c-menu" type="button" aria-haspopup="true" aria-expanded="false">Menu</button>
</header>
<div class="pop" id="menu" hidden></div>

<main id="stage">
  <div id="readbar" aria-hidden="true"><i></i></div>
  <section class="layer" id="L0" aria-label="Map"></section>
  <section class="layer" id="L1" aria-label="Track"></section>
  <section class="layer" id="L2" aria-label="Concept"></section>
  <section class="layer" id="L3" aria-label="Detail"></section>
</main>

<nav id="zoombar" aria-label="Zoom">
  <button class="z" id="z-out" type="button" aria-label="Zoom out" aria-keyshortcuts="-" title="Zoom out ( - )">−</button>
  <div class="stops" id="z-stops" role="group" aria-label="Zoom stops"></div>
  <button class="z" id="z-in" type="button" aria-label="Zoom in" aria-keyshortcuts="+" title="Zoom in ( + )">+</button>
  <span class="crumb" id="crumb"></span>
  <span class="zhint" aria-hidden="true"><kbd>-</kbd><kbd>+</kbd><span>zoom</span><kbd class="nav">←</kbd><kbd class="nav">→</kbd><kbd class="nav">Enter</kbd><span class="nav">move, open</span><kbd>Esc</kbd><span>up</span></span>
  <button id="z-keys" type="button" aria-label="Keyboard shortcuts" aria-keyshortcuts="?" title="Keyboard shortcuts ( ? )"><kbd aria-hidden="true">?</kbd>keys</button>
</nav>

<div id="review" role="dialog" aria-modal="true" aria-labelledby="rv-title" hidden></div>
<div id="sandbox" role="dialog" aria-modal="true" aria-labelledby="sb-title" hidden></div>
<div id="keys" role="dialog" aria-modal="true" aria-labelledby="ky-title" hidden></div>
<div id="find" role="dialog" aria-modal="true" aria-label="Find" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="widgets.js"></script>
<script src="app.js"></script>
</body>
</html>
